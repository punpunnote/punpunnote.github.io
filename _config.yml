title: ぷんぷんノート
description: 暮らしに役立つ情報を整理してお届けするブログ
lang: ja
url: "https://punpunnote.github.io"
theme: minima
author: ぷんぷんノート
markdown: kramdown

# カテゴリをURLに含めない。ジャンル転換で記事を再分類してもURLが変わらないようにするため。
permalink: /:title/

header_pages:
  - categories.md
  - about.md

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - CLAUDE.md
  - README.md
  - templates
